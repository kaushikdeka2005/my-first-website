<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My World | My First Website</title>

<style>

/* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;

    /* CHANGED BACKGROUND */
    background: #eef2ff;

    color: #222;
}


/* ---------- HEADER ---------- */

.header {
    min-height: 70vh;

    /* CHANGED HEADER BACKGROUND */
    background: linear-gradient(
        135deg,
        #1e1b4b,
        #312e81,
        #4c1d95
    );

    color: white;
}


/* ---------- NAVBAR ---------- */

.navbar {
    width: 90%;
    max-width: 1100px;

    margin: auto;
    padding: 25px 0;

    display: flex;
    justify-content: space-between;
    align-items: center;
}


.logo {
    font-size: 28px;
}


.nav-links {
    display: flex;
    gap: 30px;
}


.nav-links a {
    color: white;

    text-decoration: none;

    font-size: 17px;

    transition: 0.3s;
}


.nav-links a:hover {
    color: #c4b5fd;
}


/* ---------- HERO ---------- */

.hero {
    min-height: 55vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;
}


.hero h1 {
    font-size: clamp(40px, 7vw, 75px);

    margin-bottom: 15px;
}


.hero p {
    font-size: 20px;

    /* CHANGED */
    color: #ddd6fe;

    margin-bottom: 30px;
}


/* ---------- EXPLORE BUTTON ---------- */

.hero-btn {
    display: inline-block;

    padding: 13px 28px;

    background: white;

    /* CHANGED */
    color: #4c1d95;

    text-decoration: none;

    border-radius: 30px;

    font-weight: bold;

    transition: 0.3s;
}


.hero-btn:hover {
    transform: translateY(-3px);

    /* CHANGED */
    background: #c4b5fd;

    box-shadow:
        0 10px 25px rgba(76, 29, 149, 0.3);
}


/* ---------- MAIN CONTAINER ---------- */

.container {
    width: 90%;
    max-width: 1100px;

    margin: 70px auto;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 30px;
}


/* ---------- BOXES ---------- */

.box {
    background: white;

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(76, 29, 149, 0.10);

    transition: 0.3s;
}


.box:hover {
    transform: translateY(-8px);

    box-shadow:
        0 15px 35px rgba(76, 29, 149, 0.18);
}


.box h2 {
    font-size: 28px;

    margin-bottom: 10px;
}


.description {
    /* CHANGED */
    color: #6b7280;

    margin-bottom: 30px;
}


/* ---------- FORM ---------- */

form {
    display: flex;

    flex-direction: column;

    gap: 20px;
}


.input-group {
    display: flex;

    flex-direction: column;

    gap: 8px;
}


.input-group label {
    font-weight: bold;
}


.input-group input {
    padding: 13px 15px;

    /* CHANGED */
    border: 1px solid #c7d2fe;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

    transition: 0.3s;
}


.input-group input:focus {
    /* CHANGED */
    border-color: #7c3aed;

    box-shadow:
        0 0 0 3px rgba(124, 58, 237, 0.1);
}


/* ---------- LOGIN BUTTON ---------- */

button {
    padding: 14px;

    border: none;

    border-radius: 10px;

    /* CHANGED */
    background: #4c1d95;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


button:hover {
    /* CHANGED */
    background: #312e81;

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(76, 29, 149, 0.25);
}


/* ---------- BOX 2 ---------- */

.info {
    margin-top: 20px;

    padding: 25px;

    /* CHANGED */
    background: #f5f3ff;

    border-radius: 15px;

    text-align: center;
}


.info span {
    font-size: 45px;
}


.info h3 {
    margin: 15px 0 10px;
}


.info p {
    /* CHANGED */
    color: #6b7280;

    line-height: 1.6;
}


/* ---------- FOOTER ---------- */

footer {
    text-align: center;

    padding: 25px;

    /* CHANGED */
    background: #1e1b4b;

    /* CHANGED */
    color: #ddd6fe;

    font-size: 14px;
}


/* ---------- RESPONSIVE ---------- */

@media (max-width: 700px) {

    .navbar {
        flex-direction: column;

        gap: 20px;
    }


    .hero {
        min-height: 50vh;
    }


    .hero h1 {
        font-size: 42px;
    }


    .container {
        grid-template-columns: 1fr;

        margin-top: 40px;
    }


    .box {
        padding: 25px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">


    <!-- NAVBAR -->

    <nav class="navbar">

        <h2 class="logo">
            MyWorld
        </h2>


        <div class="nav-links">

            <a href="#">
                Home
            </a>

            <a href="#content">
                About
            </a>

        </div>

    </nav>


    <!-- HERO SECTION -->

    <div class="hero">

        <h1>
            Welcome To My World
        </h1>


        <p>
            This is my first website 🚀
        </p>


        <a href="#content" class="hero-btn">
            Explore
        </a>

    </div>

</header>



<!-- ================= MAIN CONTENT ================= -->

<main class="container" id="content">


    <!-- BOX 1 -->

    <div class="box">

        <h2>
            BOX 1
        </h2>


        <p class="description">
            Welcome! Enter your details below.
        </p>


        <form id="loginForm">


            <!-- NAME -->

            <div class="input-group">

                <label for="name">
                    Name
                </label>


                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button type="submit">
                Login
            </button>


        </form>

    </div>



    <!-- BOX 2 -->

    <div class="box">

        <h2>
            BOX 2
        </h2>


        <p class="description">
            This is my second big box.
        </p>


        <div class="info">

            <span>
                💻
            </span>


            <h3>
                My First Project
            </h3>


            <p>
                I am learning HTML, CSS and JavaScript
                and building my first website.
            </p>

        </div>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 MyWorld | Made with ❤️ and code
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value;

        alert(
            `Welcome, ${name}! 🚀`
        );

    }
);

</script>


</body>

</html>
