<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My World | My First Website</title>

<style>

/* ---------- RESET ---------- */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;

    background: #eef2ff;

    color: #222;

    overflow-x: hidden;
}


/* ========================================= */
/* CIRCLE BACKGROUND EFFECT */
/* ========================================= */

.background-effects {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}


.circle {

    position: absolute;

    border-radius: 50%;

    filter: blur(70px);

    opacity: 0.45;

    animation:
        moveCircle
        12s
        ease-in-out
        infinite alternate;
}


/* PURPLE */

.circle-1 {

    width: 420px;

    height: 420px;

    background: #8b5cf6;

    left: -180px;

    top: 5%;

    animation-duration: 14s;
}


/* BLUE */

.circle-2 {

    width: 380px;

    height: 380px;

    background: #3b82f6;

    right: -160px;

    top: 35%;

    animation-duration: 11s;

    animation-delay: 2s;
}


/* PINK */

.circle-3 {

    width: 350px;

    height: 350px;

    background: #ec4899;

    left: 25%;

    bottom: -180px;

    animation-duration: 15s;

    animation-delay: 4s;
}


/* VIOLET */

.circle-4 {

    width: 260px;

    height: 260px;

    background: #6366f1;

    left: 50%;

    top: 50%;

    opacity: 0.25;

    animation-duration: 18s;

    animation-delay: 1s;
}


/* MOVEMENT */

@keyframes moveCircle {

    0% {

        transform:
            translate(0, 0)
            scale(1);
    }

    50% {

        transform:
            translate(100px, -80px)
            scale(1.15);
    }

    100% {

        transform:
            translate(-70px, 90px)
            scale(0.95);
    }
}


/* ========================================= */
/* HEADER */
/* ========================================= */

.header {

    min-height: 70vh;

    background: linear-gradient(
        135deg,
        #1e1b4b,
        #312e81,
        #4c1d95
    );

    color: white;

    position: relative;

    z-index: 1;

    overflow: hidden;
}


/* ---------- NAVBAR ---------- */

.navbar {

    width: 90%;

    max-width: 1100px;

    margin: auto;

    padding: 25px 0;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.logo {

    font-size: 28px;
}


.nav-links {

    display: flex;

    gap: 30px;
}


.nav-links a {

    color: white;

    text-decoration: none;

    font-size: 17px;

    transition: 0.3s;
}


.nav-links a:hover {

    color: #c4b5fd;
}


/* ---------- HERO ---------- */

.hero {

    min-height: 55vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;
}


.hero h1 {

    font-size:
        clamp(40px, 7vw, 75px);

    margin-bottom: 15px;
}


.hero p {

    font-size: 20px;

    color: #ddd6fe;

    margin-bottom: 30px;
}


/* ---------- EXPLORE BUTTON ---------- */

.hero-btn {

    display: inline-block;

    padding: 13px 28px;

    background: white;

    color: #4c1d95;

    text-decoration: none;

    border-radius: 30px;

    font-weight: bold;

    transition: 0.3s;
}


.hero-btn:hover {

    transform:
        translateY(-3px);

    background: #c4b5fd;

    box-shadow:
        0 10px 25px
        rgba(
            76,
            29,
            149,
            0.3
        );
}


/* ========================================= */
/* MAIN CONTAINER */
/* ========================================= */

.container {

    width: 90%;

    max-width: 1100px;

    margin: 70px auto;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 30px;

    position: relative;

    z-index: 2;
}


/* ---------- BOXES ---------- */

.box {

    background: white;

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 10px 30px
        rgba(
            76,
            29,
            149,
            0.10
        );

    transition: 0.3s;
}


.box:hover {

    transform:
        translateY(-8px);

    box-shadow:
        0 15px 35px
        rgba(
            76,
            29,
            149,
            0.18
        );
}


.box h2 {

    font-size: 28px;

    margin-bottom: 10px;
}


.description {

    color: #6b7280;

    margin-bottom: 30px;
}


/* ========================================= */
/* FORM */
/* ========================================= */

form {

    display: flex;

    flex-direction: column;

    gap: 20px;
}


.input-group {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.input-group label {

    font-weight: bold;
}


.input-group input {

    padding:
        13px 15px;

    border:
        1px solid #c7d2fe;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

    transition: 0.3s;
}


.input-group input:focus {

    border-color:
        #7c3aed;

    box-shadow:
        0 0 0 3px
        rgba(
            124,
            58,
            237,
            0.1
        );
}


/* ========================================= */
/* LOGIN BUTTON */
/* ========================================= */

button {

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #4c1d95;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


button:hover {

    background: #312e81;

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(
            76,
            29,
            149,
            0.25
        );
}


/* ========================================= */
/* BOX 2 */
/* ========================================= */

.info {

    margin-top: 20px;

    padding: 25px;

    background: #f5f3ff;

    border-radius: 15px;

    text-align: center;
}


.info span {

    font-size: 45px;

    display: inline-block;

    animation:
        floatingIcon
        3s
        ease-in-out
        infinite;
}


@keyframes floatingIcon {

    0% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-10px);
    }

    100% {

        transform:
            translateY(0);
    }
}


.info h3 {

    margin:
        15px 0 10px;
}


.info p {

    color: #6b7280;

    line-height: 1.6;
}


/* ========================================= */
/* FOOTER */
/* ========================================= */

footer {

    text-align: center;

    padding: 25px;

    background: #1e1b4b;

    color: #ddd6fe;

    font-size: 14px;

    position: relative;

    z-index: 2;
}


/* ========================================= */
/* RESPONSIVE */
/* ========================================= */

@media (max-width: 700px) {

    .navbar {

        flex-direction: column;

        gap: 20px;
    }


    .hero {

        min-height: 50vh;
    }


    .hero h1 {

        font-size: 42px;
    }


    .container {

        grid-template-columns: 1fr;

        margin-top: 40px;
    }


    .box {

        padding: 25px;
    }


    .circle-1 {

        width: 280px;

        height: 280px;
    }


    .circle-2 {

        width: 250px;

        height: 250px;
    }


    .circle-3 {

        width: 230px;

        height: 230px;
    }

}

</style>

</head>


<body>


<!-- ========================================= -->
<!-- BACKGROUND CIRCLES -->
<!-- ========================================= -->

<div class="background-effects">

    <div class="circle circle-1"></div>

    <div class="circle circle-2"></div>

    <div class="circle circle-3"></div>

    <div class="circle circle-4"></div>

</div>



<!-- ================= HEADER ================= -->

<header class="header">


    <!-- NAVBAR -->

    <nav class="navbar">

        <h2 class="logo">
            MyWorld
        </h2>


        <div class="nav-links">

            <a href="https://www.google.com">
                Home
            </a>

            <a href="#content">
                About
            </a>

        </div>

    </nav>


    <!-- HERO SECTION -->

    <div class="hero">

        <h1>
            Welcome To My World
        </h1>


        <p>
            This is my first website 🚀
        </p>


        <a
            href="#content"
            class="hero-btn">

            Explore

        </a>

    </div>

</header>



<!-- ================= MAIN CONTENT ================= -->

<main
    class="container"
    id="content">


    <!-- BOX 1 -->

    <div class="box">

        <h2>
            BOX 1
        </h2>


        <p class="description">
            Welcome! Enter your details below.
        </p>


        <form id="loginForm">


            <!-- NAME -->

            <div class="input-group">

                <label for="name">
                    Name
                </label>


                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button type="submit">

                Login

            </button>


        </form>

    </div>



    <!-- BOX 2 -->

    <div class="box">

        <h2>
            BOX 2
        </h2>


        <p class="description">
            This is my second big box.
        </p>


        <div class="info">

            <span>
                💻
            </span>


            <h3>
                My First Project
            </h3>


            <p>

                I am learning HTML, CSS and JavaScript
                and building my first website.

            </p>

        </div>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>

        © 2026 MyWorld |
        Made with ❤️ and code

    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener(

    "submit",

    function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value;


        alert(
            `Welcome, ${name}! 🚀`
        );

    }

);

</script>


</body>

</html>
