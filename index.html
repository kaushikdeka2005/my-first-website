<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWorld</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #020617;
        color: white;
    }

    /* ================= SEARCH BAR ================= */

    .searchbaar {
        width: 90%;
        max-width: 700px;
        margin: 25px auto;

        display: flex;
        align-items: center;
        gap: 10px;
    }

    .searchbaar label {
        font-weight: bold;
        color: #cbd5e1;
    }

    .searchbaar input {
        flex: 1;
        padding: 12px 15px;

        border: 1px solid #334155;
        border-radius: 10px;

        background: #1e293b;
        color: white;

        outline: none;
        font-size: 15px;
    }

    .searchbaar input:focus {
        border-color: #8b5cf6;
    }

    .searchbaar button {
        padding: 12px 20px;

        border: none;
        border-radius: 10px;

        background: #7c3aed;
        color: white;

        font-weight: bold;
        cursor: pointer;

        transition: 0.3s;
    }

    .searchbaar button:hover {
        background: #6d28d9;
        transform: translateY(-2px);
    }


    /* ================= HEADER ================= */

    .header {
        min-height: 100vh;

        background:
            radial-gradient(
                circle at top left,
                #4c1d95,
                transparent 40%
            ),
            radial-gradient(
                circle at bottom right,
                #1d4ed8,
                transparent 40%
            ),
            #0f172a;

        padding-bottom: 80px;
    }


    /* ================= NAVBAR ================= */

    .navbar {
        width: 90%;
        max-width: 1100px;
        margin: auto;

        padding: 25px 0;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 28px;
        letter-spacing: 1px;
    }

    .nav-links {
        display: flex;
        gap: 30px;
    }

    .nav-links a {
        color: #cbd5e1;
        text-decoration: none;
        transition: 0.3s;
    }

    .nav-links a:hover {
        color: white;
    }


    /* ================= HERO ================= */

    .hero {
        width: 90%;
        max-width: 1100px;
        margin: auto;

        text-align: center;

        padding-top: 60px;
    }

    .hero h1 {
        font-size: clamp(40px, 7vw, 72px);
        margin-bottom: 15px;
    }

    .hero p {
        color: #cbd5e1;
        font-size: 18px;
        margin-bottom: 40px;
    }


    /* ================= LOGIN BOX ================= */

    .box {
        width: 100%;
        max-width: 430px;

        margin: auto;
        padding: 35px;

        text-align: left;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.15);

        border-radius: 22px;

        backdrop-filter: blur(15px);

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.35);
    }

    .box h2 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .description {
        color: #94a3b8;
        margin-bottom: 28px;
    }


    /* ================= FORM ================= */

    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .input-group label {
        font-size: 14px;
        font-weight: bold;
        color: #e2e8f0;
    }


    /* ================= INPUT ================= */

    .input-wrapper {
        position: relative;
    }

    .input-wrapper input {
        width: 100%;

        padding: 14px 45px 14px 15px;

        border: 1px solid #334155;
        border-radius: 12px;

        background: #0f172a;
        color: white;

        font-size: 16px;
        outline: none;

        transition: 0.3s;
    }

    .input-wrapper input::placeholder {
        color: #64748b;
    }

    .input-wrapper input:focus {
        border-color: #8b5cf6;

        box-shadow:
            0 0 0 3px rgba(139, 92, 246, 0.15);
    }


    /* ================= CLEAR BUTTON ================= */

    .clear-btn {
        position: absolute;

        right: 15px;
        top: 50%;

        transform: translateY(-50%);

        color: #64748b;

        font-size: 18px;

        cursor: pointer;

        display: none;
    }

    .clear-btn:hover {
        color: white;
    }


    /* ================= LOGIN BUTTON ================= */

    form button {
        padding: 14px;

        border: none;
        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #7c3aed,
                #4f46e5
            );

        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    form button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(124, 58, 237, 0.35);
    }


    /* ================= LIST SECTION ================= */

    .list-section {
        width: 90%;
        max-width: 700px;

        margin: 70px auto 0;
    }

    .list-title {
        text-align: center;
        margin-bottom: 25px;
    }

    .list-title h2 {
        font-size: 32px;
        margin-bottom: 8px;
    }

    .list-title p {
        color: #94a3b8;
    }


    /* ================= LIST BOX ================= */

    #userList {
        min-height: 100px;

        padding: 20px;

        border-radius: 20px;

        background: rgba(255, 255, 255, 0.06);

        border: 1px solid rgba(255, 255, 255, 0.12);

        backdrop-filter: blur(12px);

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.25);
    }


    /* ================= USER ITEM ================= */

    .user-item {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 15px 18px;

        margin-bottom: 12px;

        border-radius: 14px;

        background: rgba(255, 255, 255, 0.07);

        border: 1px solid rgba(255, 255, 255, 0.08);

        transition: 0.3s;
    }

    .user-item:last-child {
        margin-bottom: 0;
    }

    .user-item:hover {
        transform: translateX(5px);

        background: rgba(255, 255, 255, 0.11);
    }

    .user-name {
        font-size: 16px;
        font-weight: bold;
    }

    .delete-btn {
        padding: 8px 14px;

        border: none;
        border-radius: 8px;

        background: #ef4444;
        color: white;

        cursor: pointer;

        transition: 0.3s;
    }

    .delete-btn:hover {
        background: #dc2626;
        transform: scale(1.05);
    }


    /* EMPTY MESSAGE */

    .empty-message {
        text-align: center;
        color: #64748b;
        padding: 25px;
    }


    /* ================= FOOTER ================= */

    footer {
        text-align: center;

        padding: 25px;

        background: #020617;

        color: #64748b;

        font-size: 13px;
    }


    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

        .searchbaar {
            flex-direction: column;
            align-items: stretch;
        }

        .navbar {
            flex-direction: column;
            gap: 20px;
        }

        .nav-links {
            gap: 20px;
        }

        .hero {
            padding-top: 30px;
        }

        .hero h1 {
            font-size: 42px;
        }

        .box {
            padding: 25px;
        }

        .user-item {
            gap: 15px;
        }
    }
</style>

</head>

<body>


<!-- ================= SEARCH ================= -->

<div class="searchbaar">

    <label for="search">
        Search:
    </label>

    <input
        type="text"
        id="search"
        placeholder="Search Google..."
    >

    <button type="submit">
        Search
    </button>

</div>


<!-- ================= HEADER ================= -->

<header class="header">


    <!-- NAVBAR -->

    <nav class="navbar">

        <h2 class="logo">
            MyWorld
        </h2>

        <div class="nav-links">

            <a href="#">
                Home
            </a>

            <a href="#">
                About
            </a>

        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <div class="hero">

        <h1>
            Welcome To My World
        </h1>

        <p>
            This is my first website 🚀
        </p>


        <!-- LOGIN -->

        <div class="box">

            <h2>
                Login
            </h2>

            <p class="description">
                Enter your details below.
            </p>


            <form id="loginForm">


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Name
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                        <span
                            class="clear-btn"
                            onclick="clearInput('name')"
                        >
                            ✕
                        </span>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <span
                            class="clear-btn"
                            onclick="clearInput('password')"
                        >
                            ✕
                        </span>

                    </div>

                </div>


                <button type="submit">
                    Login
                </button>


            </form>

        </div>


        <!-- ================= LIST ================= -->

        <div class="list-section">

            <div class="list-title">

                <h2>
                    User List
                </h2>

                <p>
                    Users who have joined MyWorld
                </p>

            </div>


            <div id="userList">

                <div class="empty-message">
                    No users yet. Add someone above 👆
                </div>

            </div>

        </div>

    </div>

</header>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 MyWorld | Made with ❤️ and code
    </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script>


    /* ================= SEARCH ================= */

    let searchInput =
        document.querySelector("#search");

    let searchButton =
        document.querySelector(".searchbaar button");


    searchButton.addEventListener("click", function(e) {

        e.preventDefault();

        let searchValue =
            searchInput.value;

        if (searchValue) {

            window.location.href =
                `https://www.google.com/search?q=${encodeURIComponent(searchValue)}`;

        }

    });


    /* ================= CLEAR BUTTON ================= */

    const inputs =
        document.querySelectorAll(
            ".input-wrapper input"
        );


    inputs.forEach(function(input) {

        input.addEventListener("input", function() {

            const clearBtn =
                input.parentElement.querySelector(
                    ".clear-btn"
                );


            if (input.value.length > 0) {

                clearBtn.style.display = "block";

            } else {

                clearBtn.style.display = "none";

            }

        });

    });


    /* ================= CLEAR INPUT ================= */

    function clearInput(id) {

        const input =
            document.getElementById(id);

        input.value = "";

        input.focus();


        const clearBtn =
            input.parentElement.querySelector(
                ".clear-btn"
            );

        clearBtn.style.display = "none";

    }


    /* ================= LOGIN ================= */

    const loginForm =
        document.getElementById("loginForm");


    const userList =
        document.getElementById("userList");


    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value;


            /* Remove empty message */

            const emptyMessage =
                document.querySelector(".empty-message");

            if (emptyMessage) {
                emptyMessage.remove();
            }


            /* Create new list item */

            const userItem =
                document.createElement("div");

            userItem.classList.add("user-item");


            /* Create name */

            const userName =
                document.createElement("span");

            userName.classList.add("user-name");

            userName.textContent =
                name;


            /* Create delete button */

            const deleteButton =
                document.createElement("button");

            deleteButton.classList.add("delete-btn");

            deleteButton.textContent =
                "Delete";


            /* Delete functionality */

            deleteButton.addEventListener(
                "click",
                function() {

                    userItem.remove();

                }
            );


            /* Add elements */

            userItem.append(
                userName,
                deleteButton
            );


            userList.append(userItem);


            /* Clear form */

            loginForm.reset();


            /* Hide clear buttons */

            inputs.forEach(function(input) {

                const clearBtn =
                    input.parentElement.querySelector(
                        ".clear-btn"
                    );

                clearBtn.style.display = "none";

            });

        }
    );

</script>


</body>

</html>
